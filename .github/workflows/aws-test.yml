name: Deploy to S3 via OIDC

on:
  push:
    branches: [CiCdPipeline]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  S3_BUCKET: github-actions-demo-timi-827602716979
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Upload to S3
    runs-on: ubuntu-latest
    

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Detect environment
        id: detect-env
        run: |
            BRANCH_NAME="${{ github. ref }}"
            if [[ "${BRANCH_NAME}" == "refs/heads/main" ]]; then
                ENV="staging"
                ACCOUNT="827602716979"
            else
                ENV="dev"
                ACCOUNT="827602716979"
            fi
            echo "environment=${ENV}" >> $GITHUB_OUTPUT
            echo "account=${ACCOUNT}" >> $GITHUB_OUTPUT

      - name: Extract student information
        id: student-info
        run: |
            STUDENT_NAME="${{ github.actor }}"
            echo "name=${STUDENT_NAME}" >> $GITHUB_OUTPUT
            echo "Student: ${STUDENT_NAME}"

      - name: Generate enhanced session name
        id: session-naming
        run: |
            STUDENT="${{ github.actor }}"
            RUN_ID="${{ github.run_id }}"
            ATTEMPT="${{ github.run_attempt }}"

            SESSION_NAME="gha-cdk-${STUDENT}-${RUN_ID}-${ATTEMPT}"

            echo "session-name=${SESSION_NAME}" >> $GITHUB_OUTPUT
            echo "Generated session name: ${SESSION_NAME}"
            echo "Length: ${#SESSION_NAME} characters (max 64)"

            if [ ${SESSION_NAME} -gt 64]; then
                echo "❌ Session name too long!"
                exit 1
            fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            role-session-name: ${{ needs.setup.outputs.session-name }}
            aws-region: ${{ env.AWS_REGION }}

      - name: Verify OIDC credentials
        run: |
            echo "Verifying AWS credentials..."
            IDENTITY=$(aws sts get-caller-identity)
            echo "Assumed role:"
            echo "${IDENTITY}" | jq '.'

            ROLE_SESSION=$(echo "${IDENTITY}" | jq -r '.Arn' | grep -oP '(?<=/)[^/]+$')
            echo "Current session: ${ROLE_SESSION}"

      - name: Upload index.html to S3
        run: |
          aws s3 cp ./src/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --content-type "text/html" \
            --cache-control "no-cache"

      - name: Print deployed URL
        run: |
          echo "✅ Deployment complete!"
          echo "🌍 http://${{ env.S3_BUCKET }}.s3-website.${{ env.AWS_REGION }}.amazonaws.com"
